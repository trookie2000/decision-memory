[battle]
# All external writes go only to this group and these two employees. Fill in your own IDs.
mcp_url = "http://127.0.0.1:38399/mcp"
docs_cli = "kcli" # Uses public kcli docs-cli word commands.
group_id = "<你的 KIM 测试群数字 ID>"
author_id = "<命题7-出题人 的 KIM 数字 ID>"
reviewer_id = "<命题7-评审人 的 KIM 数字 ID>"
request_timeout = 150
docs_timeout = 45
worker_timeout = 600
poll_interval = 10
max_rounds = 3
notification_max_bytes = 4000 # Project policy, NOT a KIM platform limit.

# Requires the installed docs-shuttle capture wrapper; defaults to its user path.
# capture_script = "/absolute/path/to/docs-shared-capture.js"
