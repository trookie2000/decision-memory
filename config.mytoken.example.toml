[model]
# Fill the full Chat Completions URL and model granted by your MyToken gateway.
# This is a template, not a verified endpoint or claim of available credits.
endpoint = "https://your-approved-mytoken-gateway.example/v1/chat/completions"
model = "your-approved-model"
api_key_env = ""
# Replace header names with those specified by your actual gateway.
# Values below are environment variable NAMES; never put tokens here.
headers_env = { "x-token" = "MYTOKEN_APP_TOKEN", "x-username" = "MYTOKEN_USERNAME" }
timeout = 600
retries = 0
max_tokens = 32000
max_input_chars = 1000000
json_mode = true
# Enable only if supported by the selected gateway/model:
# stream = true
# reasoning_effort = "low"
# Optional actual gateway rates; missing prices keep cost null.
# input_price_per_million = 0.0
# output_price_per_million = 0.0
# cost_unit = "points"
