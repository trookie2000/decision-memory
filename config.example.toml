[model]
# Full Chat Completions URL from your approved gateway.
endpoint = "https://your-gateway.example/v1/chat/completions"
model = "your-model-name"
api_key_env = "DECISION_MEMORY_API_KEY"
# Recommended bounds for grounded/run; adapt to the gateway's actual limits.
timeout = 600
retries = 0
max_tokens = 32000
max_input_chars = 1000000
# Disable only if the gateway does not support response_format=json_object.
json_mode = true
# Optional for grounded mode. Use an inventory of source IDs before synthesis.
# grounded_strategy = "evidence-first"
# Alternative review strategy: surface evidence used by other fields in the same item.
# grounded_strategy = "witness-review"

# Optional: only enable when supported by the selected gateway/model.
# stream = true
# reasoning_effort = "low"
# For a long streamed response, timeout is also the total stream time limit.

# For gateways using custom headers, set api_key_env = "" above.
# These values are environment variable NAMES, never actual credentials.
# headers_env = { "x-token" = "MYTOKEN_APP_TOKEN", "x-username" = "MYTOKEN_USERNAME" }

# Optional rates supplied by your gateway. Costs stay null until configured.
# input_price_per_million = 0.0
# output_price_per_million = 0.0
# cost_unit = "CNY"
