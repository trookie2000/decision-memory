[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-memory"
version = "0.4.3"
description = "Evidence-grounded extraction of decisions from development conversations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
decision-memory = "decision_memory.cli:main"

[tool.setuptools.packages.find]
include = ["decision_memory*"]
